<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ประกาศ</title>

<style>

:root { --primary: #ff85a2; --secondary: #4a90e2; }
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Kanit', sans-serif; margin: 0; background: linear-gradient(135deg, #77a9eb 0%, #e06c8f 100%); background-attachment: fixed; padding: 15px; }
    .container { max-width: 1150px; margin: auto; }

/* 1. ทำให้แถบหัวข้อโปร่งใส */
h1 {
    text-align: center;
    background: transparent;
    color: white;
    padding: 18px;
    margin: 0;
    font-size: 26px;
    letter-spacing: 2px;
}

/* 2. ทำให้แถบเมนูปุ่มกดโปร่งใส */
.menu {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 15px;
    background: transparent;
}

.menu button{
    padding:10px 18px;
    border:none;
    background:#f08aa7;
    color:white;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
    transition: 0.3s;
}

.menu button:hover {
    background: #ff6f9c;
    transform: translateY(-2px);
}

.page{
    display:none;
    padding:30px;
}

.box{
    max-width:650px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 6px 15px rgba(0,0,0,0.15);
}

/* ปรับปรุงโครงสร้าง Layout สำหรับหน้าจอคอมพิวเตอร์แบบฝั่งซ้าย-ขวา */
.computer-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
}

.layout-left {
    flex: 1;
}

.layout-right {
    width: 420px;
    background: #fff5f8;
    border: 1px solid #ffc2d3;
    padding: 15px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:6px;
    margin-bottom:14px;
    border-radius:10px;
    border:1px solid #ffc2d3;
    background:#fff5f8;
    font-family: 'Kanit', sans-serif;
    color: black; /* กำหนดให้ตัวหนังสือเริ่มต้นเป็นสีดำ */
}

button.action{
    background:#ff6f9c;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight: bold;
}

button.copy{
    margin-top:6px;
    background:#ffb3c8;
    border:none;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    transition: background 0.3s, color 0.3s;
}

/* สไตล์ปุ่มตอนคัดลอกสำเร็จ */
button.copy.success {
    background: #28a745 !important;
    color: white !important;
}

.log{
    background:#fff7fb;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
    white-space:pre-wrap;
    border:1px solid #ffd0df;
    font-family: 'Kanit', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    position: relative;
}

.ruleItem{
    display:flex;
    justify-content:space-between;
    margin-bottom:5px;
    padding: 5px;
    border-bottom: 1px dashed #ffd0df;
}

/* ปรับปรุงหน้าบันทึกประกาศ */
.history-item {
    background: #fff;
    border: 1px solid #ffd0df;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 15px;
    position: relative;
    box-shadow: 0 2px 8px rgba(255, 133, 162, 0.1);
}

.history-time {
    color: #ff6f9c;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
}

.history-user {
    background: #ffeef2;
    color: #ff6f9c;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
    border: 1px solid #ffccd5;
}

.history-text {
    color: #444;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 10px;
    padding-right: 40px;
}

.delete-log-btn {
    position: absolute;
    right: 15px;
    bottom: 15px;
    background: #ffe5ed;
    color: #ff4d4d;
    border: 1px solid #ffccd5;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.2s;
}

.delete-log-btn:hover {
    background: #ff4d4d;
    color: white;
}

/* สไตล์เพิ่มเติมสำหรับหน้าจัดการ */
.manage-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; }
.delete-btn { background: #ff4d4d; color: white; border: none; border-radius: 5px; cursor: pointer; padding: 2px 8px; }

/* การจัดการสีของ optgroup และ option */
optgroup { font-weight: bold; background: #fff0f5; }
optgroup[label*="FAMILY"], optgroup[label*="GANG"], optgroup[label*="โรงพยาบาล"] { color: #ff6f9c !important; }
optgroup[label*="BLACKLIST"], optgroup[label*="สตอรี่"] { color: #ff0000 !important; }

/* รายการย่อย (Option) ให้เป็นสีดำปกติเสมอ */
option { color: black !important; font-weight: normal; background: white; padding: 6px 10px; }

</style>
</head>


<body>

<h1>⚙️ ประกาศ Time Town ⚙️</h1>

<div class="menu">
<button onclick="showPage('warnPage')">ประกาศตักเตือน</button>
<button onclick="showPage('coolPage')">ประกาศคูลดาวน์</button>
<button onclick="showPage('casePage')">ไม่พบเคสสลบ</button>
<button onclick="showPage('logPage')">บันทึกประกาศ</button>
</div>

<div id="warnPage" class="page">
<div class="box" style="max-width: 1080px;">
<h2>📢 ประกาศตักเตือน</h2>

<div class="computer-layout">
    
    <div class="layout-left">
        <label>เลือกตระกูล หรือพิมพ์ชื่อเองได้</label>
        <input type="text" id="gang" list="gangOptions" placeholder="-- เลือกตระกูล หรือพิมพ์ชื่อเองที่นี่ --" onfocus="this.value=''">
        <datalist id="gangOptions">
            </datalist>

        <label>เตือนครั้งที่</label>
        <select id="warnLevel">
        <option value="1">ครั้งที่ 1</option>
        <option value="2">ครั้งที่ 2</option>
        <option value="3">ครั้งที่ 3 (BLACKLIST)</option>
        </select>

        <label>🔍 ค้นหาข้อกฎ (พิมพ์คำที่ต้องการค้นหา)</label>
        <input type="text" id="ruleSearchInput" placeholder="พิมพ์ค้นหาข้อกฎ เช่น ทำร้าย, ไม่, อาวุธ..." style="margin-bottom: 14px;">

        <label>เนื่องจาก</label>
        <input id="reason">

        <label>ค่าปรับ</label>
        <input id="fine">

        <label>สถานะ</label>
        <select id="status">
        <option selected>ยังไม่ชำระ</option>
        <option>ชำระแล้ว</option>
        </select>

        <button class="action" onclick="warn()" style="width: 100%; margin-top: 5px; padding: 12px; font-size: 16px;">สร้างประกาศ</button>
    </div>

    <div class="layout-right">
        <label style="font-weight: bold; margin-bottom: 5px; color: #ff6f9c;">📋 เลือกข้อกฎ (คลิกเลือกได้เลย):</label>
        <select id="ruleSelect" size="14" style="height: 320px; margin-bottom: 8px; background: white;">
            <option value="">-- โปรดเลือกข้อกฎจากระบบ --</option>
        </select>
        <button class="action" onclick="addRule()">เพิ่มข้อกฎที่เลือก</button>
        <div id="ruleList" class="log" style="max-height: 120px; overflow-y: auto;"></div>
    </div>

</div>

<hr style="border: 0; border-top: 1px dashed #ffc2d3; margin: 25px 0;">

<h3>📢 FiveM</h3>
<div id="warnFiveM" class="log"></div>
<button class="copy" onclick="copyText('warnFiveM',this)">คัดลอก</button>

<h3>💬 Discord</h3>
<div id="warnDiscord" class="log"></div>
<button class="copy" onclick="copyText('warnDiscord',this)">คัดลอก</button>

</div>
</div>

<div id="coolPage" class="page">
<div class="box">

<h2>⏱ ประกาศคูลดาวน์</h2>

<label>เลือกตระกูล หรือพิมพ์ชื่อเองได้</label>
<input type="text" id="coolGang" list="coolGangOptions" placeholder="-- เลือกตระกูล หรือพิมพ์ชื่อเองที่นี่ --" onfocus="this.value=''">
<datalist id="coolGangOptions">
    </datalist>

<button class="action" onclick="cooldown()">สร้างประกาศ</button>

<h3>📢 FiveM</h3>
<div id="coolFiveM" class="log"></div>
<button class="copy" onclick="copyText('coolFiveM',this)">คัดลอก</button>

<h3>💬 Discord</h3>
<div id="coolDiscord" class="log"></div>
<button class="copy" onclick="copyText('coolDiscord',this)">คัดลอก</button>

</div>
</div>

<div id="casePage" class="page">
<div class="box">

<h2>🚑 ไม่พบเคสสลบ</h2>

<label>เบอร์โทร</label>
<input id="casePhone">

<button class="action" onclick="caseMsg()">สร้างข้อความ</button>

<h3>📢 FiveM</h3>
<div id="caseGame" class="log"></div>
<button class="copy" onclick="copyText('caseGame',this)">คัดลอก</button>
    
<h3>💬 Discord</h3>
<div id="caseDiscord" class="log"></div>
<button class="copy" onclick="copyText('caseDiscord',this)">คัดลอก</button>

</div>
</div>

<div id="logPage" class="page">
<div class="box" style="max-width: 800px;">
<h2>📜 บันทึกประกาศ</h2>
<div id="history"></div>
</div>
</div>

<script type="module">
// --- 1. Firebase Setup ---
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
      apiKey: "AIzaSyDErmAM7dA7NJ19jPLGgqKEqLpFW2qwdN0",
      authDomain: "emss-ebb6e.firebaseapp.com",
      projectId: "emss-ebb6e",
      databaseURL: "https://emss-ebb6e-default-rtdb.asia-southeast1.firebasedatabase.app/",
      appId: "1:154198162358:web:f16c1ffd840ceaa8845f17"
    };

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const logRef = ref(db, 'announcement_logs');
const gangListRef = ref(db, 'gang_list');
const ruleListRef = ref(db, 'rule_list');

const SUPER_ADMIN = "Jaokha";
let currentUser = localStorage.getItem('portalUser') || null;
let userData = {}; // เก็บข้อมูลสิทธิ์ผู้ใช้แบบ Real-time

// --- 🔒 ระบบเช็คสิทธิ์แบบ Real-time 🔒 ---
if (currentUser) {
    onValue(ref(db, `portal_users/${currentUser}`), (snap) => {
        userData = snap.val() || {};
    });
}

async function checkPermission() {
    if (!currentUser) {
        alert("❌ กรุณาเข้าสู่ระบบก่อนทำรายการ");
        return false;
    }
    // เช็คจาก userData ที่ดึงมา หรือเป็น Super Admin
    if (userData.isAdmin || userData.canEdit || currentUser === SUPER_ADMIN) {
        return true;
    }
    alert("⚠️ คุณไม่มียศหรือสิทธิ์ในการดำเนินการ (ติดต่อ Admin)");
    return false;
}

function customSort(a, b) {
    return a.localeCompare(b, 'th', { numeric: true, sensitivity: 'base' });
}

// --- ฟังก์ชันดึงชื่ออัตโนมัติ ---
function getAutoUser() {
    return currentUser || "ไม่ระบุชื่อ";
}

let allGangsData = {};
let cachedRules = []; // ใช้สำหรับเก็บข้อมูลกฎทั้งหมดเพื่อทำระบบค้นหาแบบ Real-time

function renderGangSelects() {
    const gangOptions = document.getElementById('gangOptions');
    const coolGangOptions = document.getElementById('coolGangOptions');
    
    const sortedGangs = Object.keys(allGangsData).map(key => ({
        name: typeof allGangsData[key] === 'object' ? allGangsData[key].name : allGangsData[key],
        thaiName: typeof allGangsData[key] === 'object' ? allGangsData[key].thaiName : '',
        type: typeof allGangsData[key] === 'object' ? allGangsData[key].type : 'fam',
        selected: typeof allGangsData[key] === 'object' ? (allGangsData[key].selected !== false) : true
    })).sort((a, b) => customSort(a.name, b.name));

    // จัดการส่วนของหน้าตักเตือน (datalist)
    if(gangOptions) {
        gangOptions.innerHTML = '';
        sortedGangs.forEach(item => {
            if (item.selected) {
                const opt = document.createElement('option');
                opt.value = item.name;
                opt.textContent = item.thaiName ? `${item.name} — ${item.thaiName}` : item.name;
                opt.setAttribute('data-type', item.type);
                gangOptions.appendChild(opt);
            }
        });
    }

    // จัดการส่วนของหน้าคูลดาวน์ (datalist)
    if(coolGangOptions) {
        coolGangOptions.innerHTML = '';
        sortedGangs.forEach(item => {
            if (item.selected) {
                const opt = document.createElement('option');
                opt.value = item.name;
                opt.textContent = item.thaiName ? `${item.name} — ${item.thaiName}` : item.name;
                opt.setAttribute('data-type', item.type);
                coolGangOptions.appendChild(opt);
            }
        });
    }
}

// ฟังก์ชันสำหรับ Render เมนูข้อกฎ (ปรับปรุงใหม่สร้าง Optgroup ไดนามิกเพื่อให้รองรับการกรองคำค้นหา 100%)
function displayRules(filterText = "") {
    const select = document.getElementById('ruleSelect');
    if (!select) return;

    select.innerHTML = '<option value="">-- โปรดเลือกข้อกฎจากระบบ --</option>';

    // สร้างกล่องเก็บชั่วคราว
    const optgroupData = {
        basic: { label: "-- กฎพื้นฐานโรงพยาบาล --", options: [] },
        blacklist: { label: "-- กฎ BLACKLIST --", options: [] },
        story: { label: "-- ทำผิดกฎ Blacklist กรณีสตอรี่ --", options: [] }
    };

    cachedRules.forEach(r => {
        const isSelected = r.selected !== false;
        const category = r.category || 'basic';
        
        const targetCategory = (category === 'basic' || category === 'normal') ? 'basic' : category;
        
        // ข้อมูลข้อความตัวพิมพ์เล็กสำหรับตรวจจับคำค้นหา
        const ruleString = `ข้อที่ ${r.no} ${r.detail} (${Number(r.fine).toLocaleString()})`.toLowerCase();

        // ตรวจสอบความสอดคล้องกับข้อความที่ค้นหา
        if (isSelected && (filterText === "" || ruleString.includes(filterText.toLowerCase()))) {
            const opt = document.createElement('option');
            opt.value = `${r.no}|${r.fine}|${r.detail}`;
            opt.textContent = `ข้อที่ ${r.no} ${r.detail} (${Number(r.fine).toLocaleString()})`;
            
            if (optgroupData[targetCategory]) {
                optgroupData[targetCategory].options.push(opt);
            }
        }
    });
    
    // วาด optgroup ลงบนหน้าจอเฉพาะกลุ่มที่มีข้อมูลตรงกับตัวกรองเท่านั้น
    ['basic', 'blacklist', 'story'].forEach(catKey => {
        const groupInfo = optgroupData[catKey];
        if (groupInfo && groupInfo.options.length > 0) {
            const groupEl = document.createElement('optgroup');
            groupEl.label = groupInfo.label;
            groupInfo.options.forEach(opt => groupEl.appendChild(opt));
            select.appendChild(groupEl);
        }
    });
}

// --- Sync Portal Data ---
function syncPortalData() {
    onValue(gangListRef, (snapshot) => {
        allGangsData = snapshot.val() || {};
        renderGangSelects();
    });

    onValue(ruleListRef, (snapshot) => {
        const rulesData = snapshot.val();
        if (rulesData) {
            cachedRules = Object.keys(rulesData).map(key => ({
                key: key,
                ...rulesData[key]
            })).sort((a, b) => customSort(String(a.no), String(b.no)));

            // แสดงผลครั้งแรกแบบยังไม่ฟิลเตอร์
            const searchInput = document.getElementById('ruleSearchInput');
            displayRules(searchInput ? searchInput.value : "");
        }
    });
}
syncPortalData();

// ผูก Event ติดตามพิมพ์ในช่องค้นหาเพื่อกรองข้อกฎทันที
document.getElementById('ruleSearchInput').addEventListener('input', function(e) {
    displayRules(e.target.value);
});

// --- 2. Global Variables & UI Functions ---
let rules=[];
let totalFine=0;

window.showPage = function(id){
    document.querySelectorAll(".page").forEach(p=>p.style.display="none");
    document.getElementById(id).style.display="block";
}

window.addRule = function(){
    let value=document.getElementById("ruleSelect").value;
    if(!value)return;
    let data=value.split("|");
    rules.push({
        rule:data[0],
        fine:Number(data[1]),
        reason:data[2]
    });
    updateRules();
}

function updateRules(){
    let box=document.getElementById("ruleList");
    box.innerHTML="";
    totalFine=0;
    rules.forEach((r,i)=>{
        totalFine+=r.fine;
        let div=document.createElement("div");
        div.className="ruleItem";
        div.innerHTML=`ข้อ ${r.rule} (${r.fine.toLocaleString()})
        <button onclick="removeRule(${i})" style="color:red; cursor:pointer;">ลบ</button>`;
        box.appendChild(div);
    });
    document.getElementById("fine").value=totalFine.toLocaleString();
    updateReason();
}

window.removeRule = function(index){
    rules.splice(index,1);
    updateRules();
}

function updateReason(){
    let autoReason = rules.map(r=>r.reason).join(", ");
    let reasonInput=document.getElementById("reason");
    if(reasonInput.value=="" || reasonInput.dataset.auto=="true"){
        reasonInput.value=autoReason;
        reasonInput.dataset.auto="true";
    }
}

function getRuleText(){
    return rules.map(r=>r.rule).join(",");
}

function time(){
    return new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}

function date(){
    return new Date().toLocaleDateString('th-TH');
}

// --- 3. Firebase Data Handling ---

window.saveHistory = async function(text){
    const user = getAutoUser(); 
    push(logRef, {
        text: text,
        user: user,
        time: time() + " " + date(),
        timestamp: Date.now()
    });
}

onValue(logRef, (snapshot) => {
    const box = document.getElementById("history");
    box.innerHTML = "";
    const data = snapshot.val();
    if(data){
        // เช็คสิทธิ์ลบป้ายประกาศแบบ Real-time
        const iCanDelete = userData.canDelete || currentUser === SUPER_ADMIN;
        
        Object.keys(data).reverse().forEach(key => {
            const item = data[key];
            let div = document.createElement("div");
            div.className = "history-item";
            div.innerHTML = `
                <div class="history-time">
                    <span>🕒 ${item.time}</span>
                    <span class="history-user">👤 ${item.user || 'ไม่ระบุ'}</span>
                </div>
                <div class="history-text">${item.text}</div>
                ${iCanDelete ? `<button class="delete-log-btn" onclick="deleteLog('${key}')">🗑 ลบ</button>` : ''}
            `;
            box.appendChild(div);
        });
    }
});

window.deleteLog = async function(key){
    // ระบบเช็คสิทธิ์ซ้ำก่อนลบจริง
    if (userData.canDelete || currentUser === SUPER_ADMIN) {
        if(confirm("ยืนยันการลบรายการนี้?")){
            remove(ref(db, `announcement_logs/${key}`));
        }
    } else {
        alert("⚠️ คุณไม่มียศสำหรับลบข้อมูล");
    }
}

// --- 4. Logic Functions (แก้ไขระบบ 1, 2 และ 3 Blacklist) ---

window.warn = function(){
    let input = document.getElementById("gang");
    let gang = input.value.trim();
    if(!gang) return alert("กรุณาเลือกหรือพิมพ์ชื่อตระกูล");
    
    // ค้นหาประเภทตระกูลจาก datalist options เผื่อเลือกจากประวัติ
    let type = 'fam'; 
    let options = document.querySelectorAll('#gangOptions option');
    for(let opt of options) {
        if(opt.value === gang) {
            type = opt.getAttribute('data-type') || 'fam';
            break;
        }
    }

    let reason=document.getElementById("reason").value;
    let fine=document.getElementById("fine").value;
    let status=document.getElementById("status").value;
    let level=document.getElementById("warnLevel").value;
    let ruleText=getRuleText();
    let statusText = status=="ชำระแล้ว" ? "+สถานะ : ชำระแล้ว" : "-สถานะ : ยังไม่ชำระ";

    let typeLabel = 'แก๊ง'; 

    let fivem=`/gov ประกาศตักเตือน ${typeLabel} ${gang} เนื่องจาก ${reason} เตือนครั้งที่ ${level} รวม ตักเตือน ${level} ครั้ง ขอบคุณค่ะ/ครับ`;
    let discord=`📢 ประกาศตักเตือน\n${typeLabel} ${gang}\nเหตุผล : ${reason}\nเตือนครั้งที่ ${level}`;

    // ถ้าเลือกครั้งที่ 3 ให้เปลี่ยนเป็น Blacklist
    if(level==3){
        if(status=="ยังไม่ชำระ"){
            fivem=`/gov ประกาศ Blacklist ${typeLabel} ${gang} เนื่องจาก ${reason} ขอบคุณครับ/ค่ะ`;
        }else{
            fivem=`/gov ประกาศปลด Blacklist ${typeLabel} ${gang} เนื่องจาก ชำระแล้ว`;
        }
        discord=`#  ⛔  __ BLACKLIST __ ⛔\n\n\`\`\`diff\n${typeLabel} : ${gang}\nหัวข้อ : BLACKLIST ข้อที่ ${ruleText} เนื่องจาก ${reason}\n( เมื่อเวลา ${time()} น. วันที่ ${date()} )\nค่าปรับ : ${fine} TD\n${statusText}\n\`\`\`\n\n<@&1335511632587128954> <@&1364843875105243206>`;
    }

    document.getElementById("warnFiveM").innerText=fivem;
    document.getElementById("warnDiscord").innerText=discord;
}

window.cooldown = function(){
    let input = document.getElementById("coolGang");
    let gang = input.value.trim();
    if(!gang) return alert("กรุณาเลือกหรือพิมพ์ชื่อตระกูล");

    // ค้นหาประเภทตระกูลจาก datalist เผื่อเลือกจากประวัติ
    let type = 'fam';
    let options = document.querySelectorAll('#coolGangOptions option');
    for(let opt of options) {
        if(opt.value === gang) {
            type = opt.getAttribute('data-type') || 'fam';
            break;
        }
    }

    let now=new Date();
    let end=new Date(now.getTime()+10*60000);
    let start=now.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
    let stop=end.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
    
    let typeLabel = 'แก๊ง';
    let text=`ประกาศ รบกวน ${typeLabel} ${gang} ออกจากพื้นที่โรงพยาบาลภายใน ระยะเวลา 10 นาที เริ่มตั้งแต่เวลา ${start} น. ถึง ${stop} น. ขอบคุณครับ/ค่ะ`;
    document.getElementById("coolFiveM").innerText="/gov "+text;
    document.getElementById("coolDiscord").innerText=`\`\`\`\n${text}\n\`\`\`\n<@&1335511632587128954> <@&1364843875105243206>`;
}

window.caseMsg = function(){
    let phone=document.getElementById("casePhone").value;
    let game=`/gov รบกวน เบอร์ ${phone} แพทย์ไม่พบร่างผู้สลบกรุณาติดต่อ หรือ แจ้งจุดสลบ ได้เลยค่ะ/ครับ`;
    let discord=`รบกวน เบอร์ ${phone} แพทย์ไม่พบร่างผู้สลบกรุณาติดต่อ หรือ แจ้งจุดสลบ ได้เลยค่ะ/ครับ\n<@&1335511632587128954><@&1364843875105243206>`;
    document.getElementById("caseGame").innerText=game;
    document.getElementById("caseDiscord").innerText=discord;
}

window.copyText = async function(id,btn){
    const text = document.getElementById(id).innerText;
    if(!text) return;
    
    if(!(await checkPermission())) return; // 🔒 เช็คสิทธิ์ก่อนให้คัดลอกและบันทึก

    navigator.clipboard.writeText(text);
    btn.innerText="คัดลอกสำเร็จ ✓";
    btn.classList.add("success");
    
    saveHistory(text);
    
    setTimeout(() => { 
        btn.innerText = "คัดลอก"; 
        btn.classList.remove("success");
    }, 2000);
}

// --- เพิ่มระบบ Enter สำหรับบันทึกข้อมูล ---
document.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        const warnPage = document.getElementById('warnPage');
        const coolPage = document.getElementById('coolPage');
        const casePage = document.getElementById('casePage');

        if (warnPage.style.display === 'block') {
            warn();
        } else if (coolPage.style.display === 'block') {
            cooldown();
        } else if (casePage.style.display === 'block') {
            caseMsg();
        }
    }
});

showPage("warnPage");

</script>
